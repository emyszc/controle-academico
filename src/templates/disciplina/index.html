{% load static %}
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Controle Acadêmico — IFPI</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>

<body>
    
    <main class="page">
        <div class="wrap">
            <h1 class="title">Pendências de Disciplina</h1>
            <p class="subtitle">Chaves e livros didáticos pendentes.</p>
            <form class="toolbar" method="get"><input class="input" name="q" placeholder="Buscar aluno"><button
                    class="btn outline">Buscar</button></form>
            <div class="card">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Aluno</th>
                            <th>Curso / Turma</th>
                            <th>Pendências</th>
                            <th>Sincronização</th>
                        </tr>
                    </thead>
                   
                </table>
            </div>
        </div>
    </main>
    <footer class="footer"><span>IFPI – Instituto Federal do Piauí | Setor de Controle Acadêmico — Campus
            Paulistana</span><span>Suporte &nbsp; Privacidade &nbsp; Sair</span></footer>
</body>

</html>
