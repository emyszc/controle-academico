{% load static %}

<link rel="stylesheet" href="{% static 'styles.css' %}">

<header class="top">
    <div class="brand"> <img src="{% static 'img/if.png' %}" alt="" width="20" height="30">
        <div><b>Instituto Federal</b><small>Piauí — Campus Paulistana</small></div>
    </div>
    <nav class="nav">
        <a {% if request.path == '/pendencias/' %} class="active" {% endif %} href="{% url 'pendencias' %}">Documentos</a>
        <a {% if request.path == '/biblioteca/' %} class="active" {% endif %} href="{% url 'biblioteca' %}">Biblioteca</a>
        <a {% if request.path == '/disciplina/' %} class="active" {% endif %} href="{% url 'disciplina' %}">Disciplina</a>
        <a {% if request.path == '/cursos/' %} class="active" {% endif %} href="{% url 'cursos' %}">Cursos</a>
    </nav>
    <div class="d-flex justify-content-center align-items-center gap-2">
        <div class="avatar text-bg-info">
            {{ request.user.first_name|first|upper }}{{ request.user.last_name|last|upper }}
        </div>

        <div class="d-flex flex-column justify-content-center">
            {{ request.user.first_name }} {{ request.user.last_name }}
            <span style="color:#bbf7d0">Controle Acadêmico</span>
        </div>
    </div>

    <a class="btn btn-outline-danger" href="{% url 'sair' %}">
        <i class="bi bi-box-arrow-in-left"></i>

        Sair
    </a>
</header>
