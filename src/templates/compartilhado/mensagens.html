{% if messages %}
    {% for message in messages %}
        <div class="alert alert-dismissible fade show alert alert-{{ message.tags }} {% if message.tags == 'error' %} alert-danger {% endif %}" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    {% endfor %}
{% endif %}
