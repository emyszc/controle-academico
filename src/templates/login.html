<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Controle Acadêmico</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #198754;
            color: white;
            border: none;
            cursor: pointer;
        }

        .mensagem {
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Controle Acadêmico</h2>

        <h3>Entrar no sistema</h3>

        {% for message in messages %}
            <p class="mensagem">{{ message }}</p>
        {% endfor %}

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Digite seu usuário"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">Entrar</button>

        </form>

        <p>
            Não possui cadastro?
            <a href="{% url 'cadastro' %}">Cadastre-se</a>
        </p>

    </div>

</body>
</html>
